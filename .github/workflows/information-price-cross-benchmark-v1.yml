name: INSACERMO Information Price Cross Benchmark V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/information_price_cross_benchmark_regression_v1.py
      - .github/workflows/information-price-cross-benchmark-v1.yml
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - run: python experiments/information_price_cross_benchmark_regression_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_INFORMATION_PRICE_CROSS_BENCHMARK_V1
          path: INFORMATION_PRICE_CROSS_BENCHMARK_REGRESSION_V1.json
          if-no-files-found: error
