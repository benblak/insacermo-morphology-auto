name: INSACERMO Lean energy hidden-work audit
on:
  push:
    branches:
      - 'lab/lean-energie-forces-20261105'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.22
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.22.0
      - name: Compile formal laboratory
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" lab/lean_energie/InsacermoEnergyLimits.lean
