name: INSACERMO Blind SciGRID Capacitated Joint V1

on:
  pull_request:
    paths:
      - 'experiments/blind_scigrid_capacitated_joint_v1.py'
      - 'experiments/run_blind_scigrid_capacitated_joint_v1_compat.py'
      - '.github/workflows/blind-scigrid-capacitated-joint-v1.yml'

jobs:
  blind-scigrid-capacitated-joint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific stack
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'pypsa==1.3.0' 'scipy>=1.16' 'networkx>=3.0'
      - name: Run fixed-before-result capacitated joint protocol
        run: PYTHONPATH=experiments python3 experiments/run_blind_scigrid_capacitated_joint_v1_compat.py
