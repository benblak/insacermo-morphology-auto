name: Laboratory Bari 2026a published phase intervals (isolated)
on:
  push:
    branches:
      - 'lab/antimatter-two-published-models-20261119'
    paths:
      - 'labs/leptogenesis_real_discrimination_20261119/BariPublishedIntervalBridge.lean'
      - 'labs/leptogenesis_real_discrimination_20261119/audit_bari_2026a_intervals.py'
      - '.github/workflows/lab-bari-2026a-intervals.yml'
  workflow_dispatch:
jobs:
  verify_bari_intervals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original engine remains untouched
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("insacermo_one_engine.py").read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(p)).encode()+b"\0"+p).hexdigest()
          assert blob=="bd5310b3692bcbad4e874005b7dd8eda90616f74",blob
          print("FROZEN_C3_BLOB_OK")
          PY
      - name: Run published endpoint arithmetic
        run: |
          python3 labs/leptogenesis_real_discrimination_20261119/audit_bari_2026a_intervals.py
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile independent interval lemmas
        run: |
          lean --version
          lean labs/leptogenesis_real_discrimination_20261119/BariPublishedIntervalBridge.lean
      - name: Reject proof holes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path("labs/leptogenesis_real_discrimination_20261119/BariPublishedIntervalBridge.lean")
          s=path.read_text()
          s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          s=re.sub(r'--[^\n]*','',s)
          assert re.search(r'\b(sorry|admit|axiom)\b',s) is None
          print("NO_PROOF_HOLES")
          PY
