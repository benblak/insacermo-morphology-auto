name: INSACERMO Raw Contract V6
on:
  push:
    branches: [insacermo-openflights-blind-dual-failure-v2-2026-10-09]
    paths:
      - experiments/openflights_raw_contract_to_certificates_v6.py
      - experiments/openflights_raw_contracts_v6.json
      - .github/workflows/openflights-raw-contract-v6.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=.:experiments python experiments/openflights_raw_contract_to_certificates_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_RAW_CONTRACT_TO_CERTIFICATES_V6
          path: INSACERMO_RAW_CONTRACT_TO_CERTIFICATES_V6.json
          if-no-files-found: error
