name: INSACERMO LAB DUNE HyperK forecast-vs-certainty C3 Lean
on:
  push:
    branches: ['lab/antimatter-two-published-models-20261119']
    paths:
      - 'labs/leptogenesis_real_discrimination_20261119/DetectorPrecisionVsCertainty.lean'
      - 'labs/leptogenesis_real_discrimination_20261119/audit_detector_precision_c3.py'
      - '.github/workflows/lab-detector-precision-proxy-c3-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LEAN_PATH: '.:lean'
      PYTHONPATH: '.'
      DETECTOR_C3_OUT: /tmp/insacermo-detector-precision
    steps:
      - uses: actions/checkout@v4
      - name: Check unchanged original C3 and syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('insacermo_one_engine.py').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(src)).encode()+b'\0'+src).hexdigest()
          assert sha=='bd5310b3692bcbad4e874005b7dd8eda90616f74',sha
          print("ORIGINAL_C3_BLOB_UNCHANGED")
          PY
          python3 -m py_compile labs/leptogenesis_real_discrimination_20261119/audit_detector_precision_c3.py
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original C3 portable verifier
        run: |
          set -euo pipefail
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Compile conditional detector geometry Lean theorems
        run: |
          lean labs/leptogenesis_real_discrimination_20261119/DetectorPrecisionVsCertainty.lean
      - name: Reject all new proof holes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('labs/leptogenesis_real_discrimination_20261119/DetectorPrecisionVsCertainty.lean').read_text()
          s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          s=re.sub(r'--[^\n]*','',s)
          assert not re.search(r'\b(sorry|admit|axiom)\b',s)
          print("NO_LEAN_PROOF_HOLES")
          PY
      - name: Run independent circle oracle and original C3 Lean replay
        run: |
          python3 labs/leptogenesis_real_discrimination_20261119/audit_detector_precision_c3.py
      - name: Archive decisions and proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_DETECTOR_PRECISION_HARD_BOUND_PROXY_C3_LEAN
          path: /tmp/insacermo-detector-precision/
          if-no-files-found: ignore
          retention-days: 30
