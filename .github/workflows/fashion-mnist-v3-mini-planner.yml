name: fashion-mnist-v3-mini-planner

on:
  push:
    branches:
      - insacermo-fashion-mnist-v3-audit-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download official Fashion-MNIST
        run: |
          set -euo pipefail
          mkdir -p experiments/fashion_mnist_v3/data experiments/fashion_mnist_v3/results_mini
          cd experiments/fashion_mnist_v3/data
          base=https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion
          curl -L --fail --retry 3 -o train-images-idx3-ubyte.gz "$base/train-images-idx3-ubyte.gz"
          curl -L --fail --retry 3 -o train-labels-idx1-ubyte.gz "$base/train-labels-idx1-ubyte.gz"
          curl -L --fail --retry 3 -o t10k-images-idx3-ubyte.gz "$base/t10k-images-idx3-ubyte.gz"
          curl -L --fail --retry 3 -o t10k-labels-idx1-ubyte.gz "$base/t10k-labels-idx1-ubyte.gz"
      - name: Mini exact frontier
        run: |
          set -u
          cd experiments/fashion_mnist_v3
          for fam in block4_q2 block4_q4
          do
            for per in 1 2
            do
              for dep in 1 2 3 4
              do
                out="results_mini/${fam}_per${per}_d${dep}.json"
                echo "=== $fam per=$per depth=$dep ==="
                timeout 30 node FASHION_MNIST_V3_AUDIT.js planner                   data/train-images-idx3-ubyte.gz data/train-labels-idx1-ubyte.gz                   data/t10k-images-idx3-ubyte.gz data/t10k-labels-idx1-ubyte.gz                   "$fam" "$per" "$dep" > "$out" 2>&1
                rc=$?
                if [ $rc -eq 124 ]; then echo '{"status":"TIMEOUT"}' > "$out"; fi
                cat "$out"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_FASHION_MNIST_V3_MINI_PLANNER_2026-10-05
          path: experiments/fashion_mnist_v3/results_mini/
          if-no-files-found: error
          retention-days: 90
