name: INSACERMO Fashion Instance Certificates V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/fashion_instance_certificates_v1.py
      - .github/workflows/fashion-instance-certificates-v1.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python experiments/fashion_instance_certificates_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_FASHION_INSTANCE_CERTIFICATES_V1
          path: FASHION_INSTANCE_CERTIFICATES_V1.json
          if-no-files-found: error
