name: MetroAT V1 Parquet Schema Gate

on:
  push:
    branches: [insacermo-metroat-prospective-v1]
    paths:
      - '.github/workflows/metroat-v1-parquet-schema.yml'
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download official TRAIN only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 --progress-bar \
            -o train.zip \
            https://researchdata.tuwien.ac.at/api/records/9ja0q-bq581/files/train.zip/content
          echo "6ba8fd0cd9c65b02ca5319e99a6fa002  train.zip" | md5sum -c -
      - name: Install parquet reader
        run: python -m pip install --quiet pyarrow
      - name: Read one Parquet schema only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile, tempfile, pathlib, json, pyarrow.parquet as pq
          with zipfile.ZipFile("train.zip") as z:
              names=[n for n in z.namelist() if n.endswith(".parquet")]
              assert names, "no parquet"
              n=names[0]
              p=pathlib.Path("sample.parquet")
              with z.open(n) as src, p.open("wb") as dst:
                  while True:
                      b=src.read(1024*1024)
                      if not b: break
                      dst.write(b)
          schema=pq.read_schema("sample.parquet")
          print("ENTRY",n)
          print("N_COLUMNS",len(schema.names))
          print("COLUMNS_JSON",json.dumps(schema.names))
          print("SCHEMA")
          print(schema)
          pathlib.Path("metroat_v1").mkdir(exist_ok=True)
          pathlib.Path("metroat_v1/PARQUET_SCHEMA_RECEIPT.json").write_text(
              json.dumps({"entry":n,"n_columns":len(schema.names),"columns":schema.names,
                          "types":[str(schema.field(i).type) for i in range(len(schema.names))]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metroat-v1-parquet-schema
          path: metroat_v1/PARQUET_SCHEMA_RECEIPT.json
          retention-days: 30
