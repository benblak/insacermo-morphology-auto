name: INSACERMO HTTP API V1

on:
  push:
    branches:
      - insacermo-structural-audit-kernel-v1-20260920
    paths:
      - 'engine/http_api_v1.py'
      - 'engine/test_http_api_v1.py'
      - 'engine/contract_cli_v1.py'
      - 'engine/*_backend_v1.py'
      - 'site_prototype/**'
      - '.github/workflows/http_api_v1.yml'
  pull_request:
    paths:
      - 'engine/http_api_v1.py'
      - 'engine/test_http_api_v1.py'
      - 'engine/contract_cli_v1.py'
      - 'engine/*_backend_v1.py'
      - 'site_prototype/**'
      - '.github/workflows/http_api_v1.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run end-to-end HTTP API tests
        run: python -m engine.test_http_api_v1
