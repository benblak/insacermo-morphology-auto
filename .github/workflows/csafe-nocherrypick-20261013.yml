name: C3 fixed 8 pane and 48 leave-one-pane-out glass
on:
  push:
    branches: [insacermo-csafe-no-cherrypick-noisy-c3-2026-10-13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original frozen C3 modules
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Verify 48 authentic panes and original frozen C3 on eight fixed panes
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/csafe_nocherrypick_20261013/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: csafe-48-lopo-fixed8-c3-lean-report
          path: audit/csafe_nocherrypick_20261013/evidence/
