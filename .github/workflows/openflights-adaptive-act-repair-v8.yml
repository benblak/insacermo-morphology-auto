name: INSACERMO OpenFlights Adaptive ACT REPAIR V8
on:
  push:
    branches: [insacermo-openflights-blind-dual-failure-v2-2026-10-09]
    paths:
      - experiments/openflights_adaptive_act_repair_v8.py
      - .github/workflows/openflights-adaptive-act-repair-v8.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=.:experiments python experiments/openflights_adaptive_act_repair_v8.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_OPENFLIGHTS_ADAPTIVE_ACT_REPAIR_V8
          path: INSACERMO_OPENFLIGHTS_ADAPTIVE_ACT_REPAIR_V8.json
          if-no-files-found: error
