name: INSACERMO Contract Masking Reveal V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/contract_masking_reveal_v1.py
      - .github/workflows/contract-masking-reveal-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/contract_masking_reveal_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_CONTRACT_MASKING_REVEAL_V1
          path: CONTRACT_MASKING_REVEAL_V1.json
          if-no-files-found: error
