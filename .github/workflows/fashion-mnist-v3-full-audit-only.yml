name: fashion-mnist-v3-full-audit-only

on:
  push:
    branches:
      - insacermo-fashion-mnist-v3-audit-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download official Fashion-MNIST
        run: |
          set -euo pipefail
          mkdir -p experiments/fashion_mnist_v3/data experiments/fashion_mnist_v3/results_full
          cd experiments/fashion_mnist_v3/data
          base=https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion
          curl -L --fail --retry 3 -o train-images-idx3-ubyte.gz "$base/train-images-idx3-ubyte.gz"
          curl -L --fail --retry 3 -o train-labels-idx1-ubyte.gz "$base/train-labels-idx1-ubyte.gz"
          curl -L --fail --retry 3 -o t10k-images-idx3-ubyte.gz "$base/t10k-images-idx3-ubyte.gz"
          curl -L --fail --retry 3 -o t10k-labels-idx1-ubyte.gz "$base/t10k-labels-idx1-ubyte.gz"
          sha256sum *.gz | tee ../results_full/DATA_SHA256.txt
      - name: Run full 60k/10k audit
        run: |
          cd experiments/fashion_mnist_v3
          node FASHION_MNIST_V3_AUDIT.js audit             data/train-images-idx3-ubyte.gz data/train-labels-idx1-ubyte.gz             data/t10k-images-idx3-ubyte.gz data/t10k-labels-idx1-ubyte.gz             | tee results_full/FASHION_MNIST_FULL_AUDIT.json
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_FASHION_MNIST_V3_FULL_AUDIT_2026-10-05
          path: experiments/fashion_mnist_v3/results_full/
          if-no-files-found: error
          retention-days: 90
