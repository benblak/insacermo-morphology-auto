name: INSACERMO Total Horizon Information Price V1
on:
  push:
    branches: [insacermo-total-horizon-information-price-v1-20261010]
    paths:
      - lean/TotalHorizonInformationPriceV1.lean
      - .github/workflows/total-horizon-information-price-v1.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - run: lean lean/TotalHorizonInformationPriceV1.lean
      - run: |
          if grep -nE '^ *\b(sorry|admit|axiom)\b' lean/TotalHorizonInformationPriceV1.lean; then exit 1; fi
          echo ZERO_SHORTCUTS
