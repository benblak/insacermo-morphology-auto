name: INSACERMO V2 Real Obstruction Path Audit

on:
  pull_request:
    paths:
      - 'experiments/v2_real_obstruction_path_audit.py'
      - 'V2_REAL_OBSTRUCTION_PATH_AUDIT_FROZEN_PROTOCOL_2026-09-19.md'
      - '.github/workflows/v2-real-obstruction-path-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen V2 real obstruction-path audit
        run: python3 experiments/v2_real_obstruction_path_audit.py
