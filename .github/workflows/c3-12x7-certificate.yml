name: C3 12x7 isolated Lean audit
on:
  push:
    branches:
      - research/c3-12x7-certificate-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: c3cert
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: c3cert
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
      - name: Compile Lean certificate
        run: |
          lake build
          lake env lean C3Decision12x7.lean
      - name: Independently check kernel
        run: lake env leanchecker C3Decision12x7
