name: INSACERMO Exhaustive Falsification V1

on:
  push:
    branches:
      - insacermo-exhaustive-falsification-v1
  workflow_dispatch:

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Run exhaustive finite audit
        run: python3 audits/exhaustive_finite_kernel_audit.py
      - name: Show audit artifact
        run: cat artifacts/exhaustive_finite_audit.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: insacermo-exhaustive-finite-audit
          path: artifacts/exhaustive_finite_audit.json
