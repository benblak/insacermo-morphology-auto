name: INSACERMO Multi-Atom Signature Audit

on:
  pull_request:
    paths:
      - 'experiments/openflights_multi_atom_signature_audit_v1.py'
      - '.github/workflows/multi-atom-signature-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run systematic multi-atom signature audit
        run: python experiments/openflights_multi_atom_signature_audit_v1.py
