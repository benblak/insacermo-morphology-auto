name: INSACERMO Witness Packing Benchmark

on:
  pull_request:
    paths:
      - 'experiments/openflights_witness_packing_benchmark_v1.py'
      - '.github/workflows/witness-packing-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run systematic OpenFlights witness-packing benchmark
        run: python experiments/openflights_witness_packing_benchmark_v1.py
