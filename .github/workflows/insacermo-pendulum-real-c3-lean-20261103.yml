name: INSACERMO pendulum real measurements - original C3 kernel independent lab
on:
  push:
    branches:
      - insacermo-pendule-c3-reel-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pendulum-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged portable generic kernel and THREE new pendulum certificates
        env:
          LEAN_PATH: ".:lean"
        run: |
          set -euo pipefail
          lean --version
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
          lean C3/PendulumCoarseRefusal20261103.lean
          lean C3/PendulumReportSet20261103.lean
          lean C3/PendulumFineConditional20261103.lean
      - name: Reject placeholders and extra axioms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for n in ['PendulumCoarseRefusal20261103','PendulumReportSet20261103','PendulumFineConditional20261103']:
              p=Path('C3')/(n+'.lean')
              s=p.read_text()
              s=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
              s=re.sub(r'--[^\n]*','',s)
              assert not re.search(r'\b(sorry|admit|axiom)\b',s),str(p)
          print('NO_ADMISSIONS')
          PY
