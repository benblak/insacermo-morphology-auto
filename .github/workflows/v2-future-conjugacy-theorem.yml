name: INSACERMO V2 Future Conjugacy Theorem

on:
  pull_request:
    paths:
      - 'formal/actionability_information/InsacermoActionabilityInformation/FutureConjugacyInvariance.lean'
      - 'formal/actionability_information/InsacermoActionabilityInformation.lean'
      - '.github/workflows/v2-future-conjugacy-theorem.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/actionability_information
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/elan-init-action@v1
      - name: Build formal kernel extension
        run: lake build
