name: INSACERMO TOTAL C3 Historical Bridge Lean
on:
  push:
    branches:
      - insacermo-total-c3-symbolic-dynamic-bridge-v1-20261011
  pull_request:
    branches:
      - insacermo-c3pp-adaptive-bellman-budget-kernel-v1-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile historical kernels plus TOTAL C3 bridge
        env:
          LEAN_PATH: ".:lean"
        run: |
          set -euo pipefail
          lean --version
          lean -o C3/DoubleEnvelopeKernel.olean C3/DoubleEnvelopeKernel.lean
          lean -o C3/UnknownLawsProbeKernel.olean C3/UnknownLawsProbeKernel.lean
          lean -o C3/AdaptiveBudgetKernel.olean C3/AdaptiveBudgetKernel.lean
          lean -o lean/DynamicJointureKernelV1.olean lean/DynamicJointureKernelV1.lean
          lean -o lean/SymbolicTransformationSynthesisV1.olean lean/SymbolicTransformationSynthesisV1.lean
          lean -o lean/MaxDualSynthesisCertificateV1.olean lean/MaxDualSynthesisCertificateV1.lean
          lean C3/TotalSymbolicDynamicBridgeV1.lean
      - name: Static audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path("C3/TotalSymbolicDynamicBridgeV1.lean")]:
              t=p.read_text()
              t=re.sub(r"/-.*?-/", "", t, flags=re.S)
              t=re.sub(r"--[^\n]*","",t)
              assert not re.search(r"\b(sorry|admit|axiom)\b",t), str(p)
          print("No admitted proof in bridge")
          PY
