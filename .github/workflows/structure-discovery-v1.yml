name: INSACERMO Structure Discovery V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/structure_discovery_v1.py
      - .github/workflows/structure-discovery-v1.yml
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/structure_discovery_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_STRUCTURE_DISCOVERY_V1
          path: STRUCTURE_DISCOVERY_V1.json
          if-no-files-found: error
