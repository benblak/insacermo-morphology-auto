name: INSACERMO global n736 Lean guided branch certificates
on:
  push:
    branches: ['lab/erdos302-737-one-proof-20261120']
    paths:
      - 'labs/erdos302_736_full_lean/generate_guided_branch_proof.py'
      - '.github/workflows/lab-erdos736-guided-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guided:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ERDOS_GUIDED_OUT: /tmp/erdos736-guided
    steps:
      - uses: actions/checkout@v4
      - name: Generate 57 SAT leaf proofs and global n736 theorem
        run: |
          python3 labs/erdos302_736_full_lean/generate_guided_branch_proof.py
          wc -c "$ERDOS_GUIDED_OUT/Erdos736Guided.lean"
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact global theorem with Lean proof-producing SAT
        run: |
          lean --version
          (cd "$ERDOS_GUIDED_OUT" && lean Erdos736Guided.lean)
      - name: No proof placeholders
        run: |
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          s=(Path(os.environ['ERDOS_GUIDED_OUT'])/'Erdos736Guided.lean').read_text()
          s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          s=re.sub(r'--[^\n]*','',s)
          assert not re.search(r'\b(sorry|admit|axiom)\b',s)
          print('NO_LEAN_PROOF_HOLES')
          PY
      - name: Archive generated Lean formalization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_ERDOS736_GUIDED_FULL_PROOF
          path: /tmp/erdos736-guided/
          if-no-files-found: ignore
          retention-days: 60
