name: INSACERMO CSP-MZN-2013 Blind Planner

on:
  pull_request:
    paths:
      - 'experiments/INSACERMO_CSPMZN2013_BLIND_PLANNER_PREREG_V1.json'
      - 'experiments/run_cspmzn2013_blind_planner_v1.py'
      - '.github/workflows/insacermo_cspmzn2013_blind_planner.yml'

jobs:
  execute-frozen-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Verify preregistration exists before execution
        run: |
          test -f experiments/INSACERMO_CSPMZN2013_BLIND_PLANNER_PREREG_V1.json
          python - <<'PY'
          import json
          p='experiments/INSACERMO_CSPMZN2013_BLIND_PLANNER_PREREG_V1.json'
          d=json.load(open(p))
          assert d['status']=='FROZEN_BEFORE_ALGORITHM_RUNS_OPENED'
          print('Frozen preregistration:', d['name'])
          PY
      - name: Execute frozen real-data planner
        run: python experiments/run_cspmzn2013_blind_planner_v1.py
      - name: Show machine verdict
        run: cat experiments/cspmzn2013_blind_planner_v1_output/REPORT.md
      - name: Upload complete audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_CSPMZN2013_BLIND_PLANNER_V1
          path: experiments/cspmzn2013_blind_planner_v1_output/
          if-no-files-found: error
