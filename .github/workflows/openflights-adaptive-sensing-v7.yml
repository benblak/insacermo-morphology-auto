name: INSACERMO OpenFlights Adaptive Sensing V7
on:
  push:
    branches: [insacermo-openflights-blind-dual-failure-v2-2026-10-09]
    paths:
      - experiments/openflights_adaptive_sensing_v7.py
      - .github/workflows/openflights-adaptive-sensing-v7.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=.:experiments python experiments/openflights_adaptive_sensing_v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_OPENFLIGHTS_ADAPTIVE_SENSING_V7
          path: INSACERMO_OPENFLIGHTS_ADAPTIVE_SENSING_V7.json
          if-no-files-found: error
