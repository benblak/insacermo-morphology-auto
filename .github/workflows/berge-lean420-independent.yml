name: INSACERMO Berge isolated Lean 4.20 audit

on:
  push:
    branches:
      - audit/berge-lean420-20261113
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: berge_lean420_audit
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.20.0 via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.20.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Confirm Lean and resolve pinned Mathlib
        run: |
          lean --version
          lake --version
          lake update
          lake exe cache get
      - name: Reject admitted or incomplete proofs
        run: |
          if grep -nE '(sorry|admit|sorryAx|native_decide)' InsacermoBerge.lean; then
            echo "Forbidden admission token in source"
            exit 1
          fi
      - name: Compile independent finite reconstruction
        run: lake env lean InsacermoBerge.lean
      - name: Independent compiled theorem artifact
        run: |
          lake env lean -o InsacermoBerge.olean InsacermoBerge.lean
          test -s InsacermoBerge.olean
