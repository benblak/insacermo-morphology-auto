name: INSACERMO Native Digits Radius One Lean
on:
  push:
    branches: [insacermo-native-digits-radius-one-guarantee-lean-2026-10-10]
    paths:
      - lean/RadiusOneSensorGuaranteeV1.lean
      - .github/workflows/native-digits-radius-one-lean.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile radius-one structural theorem
        run: lean lean/RadiusOneSensorGuaranteeV1.lean
      - name: No shortcuts
        run: |
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)[[:space:]]' lean/RadiusOneSensorGuaranteeV1.lean
