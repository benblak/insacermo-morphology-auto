name: INSACERMO Lean isolated future quotient proof

on:
  push:
    branches:
      - 'lab/lean-quotient-futurs-20261105'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4 (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.22.0
      - name: Compile external laboratory theorem file
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" lab/lean_futurs/InsacermoFuturs.lean
