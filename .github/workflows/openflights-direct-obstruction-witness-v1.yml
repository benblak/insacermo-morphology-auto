name: INSACERMO OpenFlights Direct Obstruction Witness V1
on:
  push:
    branches: [insacermo-fmnist-min-info-v1-2026-10-05]
    paths:
      - experiments/openflights_direct_obstruction_witness_v1.py
      - .github/workflows/openflights-direct-obstruction-witness-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python experiments/openflights_direct_obstruction_witness_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_OPENFLIGHTS_DIRECT_OBSTRUCTION_WITNESS_V1
          path: OPENFLIGHTS_DIRECT_OBSTRUCTION_WITNESS_V1.json
          if-no-files-found: error
