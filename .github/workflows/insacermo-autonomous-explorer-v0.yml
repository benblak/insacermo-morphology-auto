name: insacermo-autonomous-explorer-v0

on:
  push:
    branches:
      - insacermo-autonomous-explorer-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run autonomous explorer tests
        working-directory: autonomous_explorer_v0
        run: python3 test_explorer.py
      - name: Run autonomous Erdős exploration
        working-directory: autonomous_explorer_v0
        run: python3 run_erdos302.py
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_AUTONOMOUS_EXPLORER_V0
          path: autonomous_explorer_v0/autonomous_run_erdos302.json
