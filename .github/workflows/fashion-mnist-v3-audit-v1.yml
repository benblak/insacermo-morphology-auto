name: fashion-mnist-v3-audit-v1

on:
  push:
    branches:
      - insacermo-fashion-mnist-v3-audit-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download official Fashion-MNIST
        run: |
          set -euo pipefail
          mkdir -p experiments/fashion_mnist_v3/data experiments/fashion_mnist_v3/results
          cd experiments/fashion_mnist_v3/data
          base=https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion
          curl -L --fail --retry 3 -o train-images-idx3-ubyte.gz "$base/train-images-idx3-ubyte.gz"
          curl -L --fail --retry 3 -o train-labels-idx1-ubyte.gz "$base/train-labels-idx1-ubyte.gz"
          curl -L --fail --retry 3 -o t10k-images-idx3-ubyte.gz "$base/t10k-images-idx3-ubyte.gz"
          curl -L --fail --retry 3 -o t10k-labels-idx1-ubyte.gz "$base/t10k-labels-idx1-ubyte.gz"
          sha256sum *.gz | tee ../results/DATA_SHA256.txt

      - name: Full 60k/10k signature audit
        run: |
          set -euo pipefail
          cd experiments/fashion_mnist_v3
          node FASHION_MNIST_V3_AUDIT.js audit             data/train-images-idx3-ubyte.gz data/train-labels-idx1-ubyte.gz             data/t10k-images-idx3-ubyte.gz data/t10k-labels-idx1-ubyte.gz             | tee results/FASHION_MNIST_FULL_AUDIT.json

      - name: Exact planner small cohorts
        run: |
          set -euo pipefail
          cd experiments/fashion_mnist_v3
          for per in 2 3 5 8 10
          do
            echo "=== planner per_class=$per ==="
            timeout 180 node FASHION_MNIST_V3_AUDIT.js planner               data/train-images-idx3-ubyte.gz data/train-labels-idx1-ubyte.gz               data/t10k-images-idx3-ubyte.gz data/t10k-labels-idx1-ubyte.gz               block4_q4 "$per" 6               | tee "results/PLANNER_block4_q4_per${per}.json" || echo "TIMEOUT per=$per" | tee "results/PLANNER_block4_q4_per${per}.timeout.txt"
          done

      - name: Package results
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_FASHION_MNIST_V3_AUDIT_2026-10-05
          path: experiments/fashion_mnist_v3/results/
          if-no-files-found: error
          retention-days: 90
