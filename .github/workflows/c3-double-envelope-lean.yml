name: INSACERMO C3 Double Envelope Lean Kernel
on:
  push:
    branches:
      - insacermo-c3-double-envelope-lean-kernel-v1-20261011
  pull_request:
    branches:
      - insacermo-max-dual-synthesis-certificate-v1-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          test: false
          build: false
          lint: false
      - name: Check kernel with Lean 4.33.1
        run: |
          lean --version
          lean C3/DoubleEnvelopeKernel.lean
      - name: Audit absence of admitted proofs and custom axioms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("C3/DoubleEnvelopeKernel.lean").read_text()
          # Only scan declaration starts; comments and docs may mention these words.
          bad = re.findall(r"(?m)^\s*(?:sorry|admit|axiom)\b", text)
          if bad:
              raise SystemExit("Forbidden declarations: " + str(bad))
          print("No obvious proof escape (supplementary audit)")
          PY
