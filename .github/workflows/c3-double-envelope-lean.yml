name: INSACERMO C3 Double Envelope Lean Kernel
on:
  push:
    branches:
      - insacermo-c3-double-envelope-lean-kernel-v1-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          build: false
          lint: false
      - name: Check kernel with Lean 4.33.1
        run: lean C3/DoubleEnvelopeKernel.lean
      - name: Audit absence of admitted axioms
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' C3/DoubleEnvelopeKernel.lean; then
            echo 'Forbidden proof escape found'
            exit 1
          fi
          echo 'No proof escape'
