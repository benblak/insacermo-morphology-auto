name: INSACERMO C3 Double Envelope Lean Kernel
on:
  push:
    branches:
      - insacermo-c3-double-envelope-lean-kernel-v1-20261011
  pull_request:
    branches:
      - insacermo-max-dual-synthesis-certificate-v1-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean without Lake project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile Lean C3 proof
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lean C3/DoubleEnvelopeKernel.lean
      - name: Check forbidden proof escapes (independent static check)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("C3/DoubleEnvelopeKernel.lean").read_text()
          # Remove both block and line comments for this supplemental test.
          src = re.sub(r"/-.*?-/", "", src, flags=re.S)
          src = re.sub(r"--[^\n]*", "", src)
          bad = re.findall(r"\b(sorry|admit|axiom)\b", src)
          assert not bad, f"Forbidden proof escapes: {bad}"
          print("Static proof-escape scan PASS")
          PY
