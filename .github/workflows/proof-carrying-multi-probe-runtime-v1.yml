name: proof-carrying-multi-probe-runtime-v1

on:
  push:
    branches:
      - insacermo-proof-carrying-multi-probe-runtime-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install leanprover/lean4:v4.33.1
          $HOME/.elan/bin/elan default leanprover/lean4:v4.33.1
      - name: Reject sorry admit custom axiom
        run: |
          FILE=proof_carrying_multi_probe_runtime_v1/ProofCarryingMultiProbeRuntimeKernelV1.lean
          ! grep -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' "$FILE"
          ! grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "$FILE"
      - name: Lean kernel check
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lean -o costly_probe_minimal/CostlyProbeMinimal.olean costly_probe_minimal/CostlyProbeMinimal.lean
          LEAN_PATH=costly_probe_minimal $HOME/.elan/bin/lean -o safe_probe_theorem/SafeProbeTheorem.olean safe_probe_theorem/SafeProbeTheorem.lean
          LEAN_PATH=costly_probe_minimal:safe_probe_theorem $HOME/.elan/bin/lean -o probe_repair_kernel/ProbeRepairKernel.olean probe_repair_kernel/ProbeRepairKernel.lean
          LEAN_PATH=costly_probe_minimal:safe_probe_theorem:probe_repair_kernel $HOME/.elan/bin/lean -o probe_price_kernel/ProbePriceKernel.olean probe_price_kernel/ProbePriceKernel.lean
          LEAN_PATH=costly_probe_minimal:safe_probe_theorem:probe_repair_kernel:probe_price_kernel $HOME/.elan/bin/lean -o probe_reserve_debt_bridge/ProbeReserveDebtBridge.olean probe_reserve_debt_bridge/ProbeReserveDebtBridge.lean
          LEAN_PATH=costly_probe_minimal:safe_probe_theorem:probe_repair_kernel:probe_price_kernel:probe_reserve_debt_bridge $HOME/.elan/bin/lean -o multi_probe_budget_kernel/MultiProbeBudgetKernel.olean multi_probe_budget_kernel/MultiProbeBudgetKernel.lean
          LEAN_PATH=costly_probe_minimal:safe_probe_theorem:probe_repair_kernel:probe_price_kernel:probe_reserve_debt_bridge:multi_probe_budget_kernel $HOME/.elan/bin/lean -o multi_probe_planner_kernel/MultiProbePlannerKernel.olean multi_probe_planner_kernel/MultiProbePlannerKernel.lean
          LEAN_PATH=costly_probe_minimal:safe_probe_theorem:probe_repair_kernel:probe_price_kernel:probe_reserve_debt_bridge:multi_probe_budget_kernel:multi_probe_planner_kernel $HOME/.elan/bin/lean proof_carrying_multi_probe_runtime_v1/ProofCarryingMultiProbeRuntimeKernelV1.lean 2>&1 | tee proof_carrying_multi_probe_runtime_v1/lean_output.txt
      - name: Require theorem and no sorryAx
        run: |
          OUT=proof_carrying_multi_probe_runtime_v1/lean_output.txt
          for T in finite_optimal_affordable_if_any_candidate_is finite_optimal_unaffordable_refuses_all_candidates execute_certificate_implies_plan_affordable certificate_total_price_recomputes certificate_remaining_reserve_recomputes certified_execute_is_affordable certified_refuse_excludes_all_audited_candidates
          do
            grep -q "$T" "$OUT"
          done
          ! grep -q "sorryAx" "$OUT"

      - name: Python multi-probe runtime V2 tests
        run: |
          python -m proof_carrying_multi_probe_runtime_v1.test_multi_probe_runtime_v2

      - name: Python regression temporal runtime V1
        run: |
          PYTHONPATH=temporal_runtime python temporal_runtime/test_runtime_v1.py

      - name: Python regression certified online debt V1
        run: |
          PYTHONPATH=certified_online_debt_v1 python certified_online_debt_v1/test_online_debt_v1.py

      - name: Python regression final integration V1
        run: |
          PYTHONPATH=final_integration_v1:certified_online_debt_v1:minimum_proof_acquisition_v1:temporal_runtime python final_integration_v1/test_final_integration_v1.py
