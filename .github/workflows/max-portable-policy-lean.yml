name: INSACERMO MAX Portable Policy Lean V1
on:
  push:
    branches: [insacermo-max-lean-exact-operator-optimum-2026-10-09]
    paths:
      - lean/PortableOperatorPolicyCertificateV1.lean
      - .github/workflows/max-portable-policy-lean.yml
  workflow_dispatch:
jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile source dependency to module
        run: |
          mkdir -p lean
          LEAN_PATH=lean lean -o lean/MaxExactOperatorOptimumV1.olean lean/MaxExactOperatorOptimumV1.lean
      - name: Kernel check independent portable plan
        run: LEAN_PATH=lean lean lean/PortableOperatorPolicyCertificateV1.lean
      - name: Audit no proof placeholders
        run: |
          if grep -n -E '^[[:space:]]*(sorry|admit|axiom)[[:space:]]' lean/MaxExactOperatorOptimumV1.lean lean/PortableOperatorPolicyCertificateV1.lean; then exit 1; fi
          echo ZERO_SORRY_ADMIT_CUSTOM_AXIOMS
