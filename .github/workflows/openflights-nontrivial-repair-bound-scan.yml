name: INSACERMO OpenFlights Nontrivial Repair Bound Scan

on:
  pull_request:
    paths:
      - 'experiments/openflights_nontrivial_repair_bound_scan_v1.py'
      - '.github/workflows/openflights-nontrivial-repair-bound-scan.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exploratory exact scan
        run: python experiments/openflights_nontrivial_repair_bound_scan_v1.py
