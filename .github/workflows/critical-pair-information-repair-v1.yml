name: INSACERMO Critical Pair Information Repair V1
on:
  push:
    branches: [insacermo-total-critical-pair-information-repair-v1-20261010]
    paths:
      - lean/CriticalPairInformationRepairV1.lean
      - .github/workflows/critical-pair-information-repair-v1.yml
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - run: lean lean/CriticalPairInformationRepairV1.lean
      - run: |
          if grep -nE '^ *\b(sorry|admit|axiom)\b' lean/CriticalPairInformationRepairV1.lean; then exit 1; fi
          echo ZERO_SHORTCUTS
