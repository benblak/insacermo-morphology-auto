name: Rexel frozen C3 exact two-witness audit
on:
  push:
    branches: [research/rexel-c3-native-two-real-pairs-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rexel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Freeze identity and syntax
        run: |
          python3 -m py_compile insacermo_one_engine.py
          python3 -m py_compile research/rexel_c3_two_real_pairs_20261029.py
          git rev-parse HEAD
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile frozen portable C3
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Run both Rexel real witness pairs through native C3, Lean, independent replay
        env:
          LEAN_PATH: ".:lean"
        run: python3 research/rexel_c3_two_real_pairs_20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REXEL_TWO_REAL_PAIRS_NATIVE_C3_LEAN_RECEIPTS
          path: /tmp/insacermo_rexel_native_pairs
          retention-days: 90
