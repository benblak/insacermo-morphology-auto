name: INSACERMO Erdős736 proof-checker arithmetic kernel
on:
  push:
    branches: ['lab/erdos302-737-one-proof-20261120']
    paths:
      - 'proof736/**'
      - '.github/workflows/lab-erdos736-certificate-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile nontrivial weighted soundness lemmas
        run: lean proof736/CertificateKernel.lean
      - name: Check no proof holes
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('proof736/CertificateKernel.lean').read_text()
          s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          s=re.sub(r'--[^\n]*','',s)
          assert not re.search(r'\b(sorry|admit|axiom)\b',s)
          print('KERNEL_NO_HOLES')
          PY
