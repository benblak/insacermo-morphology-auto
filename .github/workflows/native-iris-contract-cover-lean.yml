name: INSACERMO Native Iris Exact Cover Lean
on:
  push:
    branches: [insacermo-native-iris-minimality-lean-2026-10-09]
    paths:
      - lean/FiniteContractCoverKernelV1.lean
      - lean/generated/IrisNativeFiniteCertificatesV1.lean
      - .github/workflows/native-iris-contract-cover-lean.yml
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.34.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile general minimality theorem
        run: LEAN_PATH=lean lean -o lean/FiniteContractCoverKernelV1.olean lean/FiniteContractCoverKernelV1.lean
      - name: Compile Iris concrete certificates
        run: LEAN_PATH=lean lean lean/generated/IrisNativeFiniteCertificatesV1.lean
      - name: No sorry admit axioms
        run: |
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)[[:space:]]' lean/FiniteContractCoverKernelV1.lean lean/generated/IrisNativeFiniteCertificatesV1.lean
