name: INSACERMO V2 Logistic Blind Change

on:
  pull_request:
    paths:
      - 'experiments/v2_logistic_blind_change.py'
      - 'V2_LOGISTIC_BLIND_CHANGE_PROTOCOL_2026-09-20.md'
      - '.github/workflows/v2-logistic-blind-change.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python3 -m pip install --quiet numpy
      - name: Run blind change detector
        run: python3 experiments/v2_logistic_blind_change.py
      - name: Upload deterministic outputs
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_LOGISTIC_BLIND_CHANGE_V0_1
          path: out/logistic_blind_change/
