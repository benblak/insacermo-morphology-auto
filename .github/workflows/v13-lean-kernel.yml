name: INSACERMO Unbounded Emergent Order Kernel

on:
  push:
    branches:
      - insacermo-unbounded-emergent-order-kernel-v1
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
      - name: Lake update
        run: lake update
      - name: Source discipline
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' \
            --include='*.lean' InsacermoV13Kernel scripts; then
            echo 'Forbidden proof placeholder/custom axiom found.'
            exit 1
          fi
      - name: Discovery Lab reproducibility
        run: python3 scripts/discovery_lab_v1.py > discovery_lab_v1_results.json
      - name: Higher-order Discovery Lab reproducibility
        run: python3 scripts/discovery_lab_v2_highorder.py > discovery_lab_v2_results.json
      - name: Unbounded-order Discovery Lab reproducibility
        run: python3 scripts/discovery_lab_v3_unbounded_order.py > discovery_lab_v3_results.json
      - name: Kernel build
        run: lake build
      - name: Axiom audit
        run: lake env lean scripts/CheckAxioms.lean
