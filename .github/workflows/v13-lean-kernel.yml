name: INSACERMO Separator Decomposition Kernel

on:
  push:
    branches:
      - insacermo-separator-decomposition-kernel-v1
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
      - name: Lake update
        run: lake update
      - name: Source discipline
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' \
            --include='*.lean' InsacermoV13Kernel scripts; then
            echo 'Forbidden proof placeholder/custom axiom found.'
            exit 1
          fi
      - name: Kernel build
        run: lake build
      - name: Axiom audit
        run: lake env lean scripts/CheckAxioms.lean
