name: INSACERMO V2 Logistic Future Complex

on:
  pull_request:
    paths:
      - 'experiments/v2_logistic_future_complex.py'
      - 'V2_LOGISTIC_FUTURE_COMPLEX_AUDIT_2026-09-20.md'
      - '.github/workflows/v2-logistic-future-complex.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python3 -m pip install --quiet numpy
      - name: Run logistic future-complex audit
        run: python3 experiments/v2_logistic_future_complex.py
      - name: Upload deterministic outputs
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_LOGISTIC_FUTURE_COMPLEX_V0_1
          path: out/logistic_future_complex/
