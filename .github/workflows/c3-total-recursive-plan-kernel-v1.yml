name: INSACERMO C3 TOTAL Recursive Plan Kernel
on:
  push:
    branches: [insacermo-c3-total-recursive-plan-kernel-v1-20261011]
  pull_request:
    branches: [insacermo-total-c3-symbolic-dynamic-bridge-v1-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile six historical kernels plus recursive kernel
        env:
          LEAN_PATH: ".:lean"
        run: |
          set -euo pipefail
          lean --version
          lean -o C3/DoubleEnvelopeKernel.olean C3/DoubleEnvelopeKernel.lean
          lean -o C3/UnknownLawsProbeKernel.olean C3/UnknownLawsProbeKernel.lean
          lean -o C3/AdaptiveBudgetKernel.olean C3/AdaptiveBudgetKernel.lean
          lean -o lean/DynamicJointureKernelV1.olean lean/DynamicJointureKernelV1.lean
          lean -o lean/SymbolicTransformationSynthesisV1.olean lean/SymbolicTransformationSynthesisV1.lean
          lean -o lean/MaxDualSynthesisCertificateV1.olean lean/MaxDualSynthesisCertificateV1.lean
          lean -o C3/TotalSymbolicDynamicBridgeV1.olean C3/TotalSymbolicDynamicBridgeV1.lean
          lean C3/RecursiveTotalPlanKernelV1.lean
      - name: Scan proof escapes in integrated sources
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = [Path('C3/RecursiveTotalPlanKernelV1.lean'),
                   Path('C3/TotalSymbolicDynamicBridgeV1.lean'),
                   Path('C3/AdaptiveBudgetKernel.lean'),
                   Path('C3/UnknownLawsProbeKernel.lean'),
                   Path('C3/DoubleEnvelopeKernel.lean'),
                   Path('lean/DynamicJointureKernelV1.lean'),
                   Path('lean/SymbolicTransformationSynthesisV1.lean'),
                   Path('lean/MaxDualSynthesisCertificateV1.lean')]
          for p in files:
              s=p.read_text()
              s=re.sub(r'/\-.*?\-/', '', s, flags=re.S)
              s=re.sub(r'--[^\n]*', '', s)
              bad=re.findall(r'\b(sorry|admit|axiom)\b',s)
              if bad: raise SystemExit(f'{p}: {bad}')
          print('Zero unproved placeholders in eight linked source files')
          PY
