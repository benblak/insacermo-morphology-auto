name: realdata-amr-capability-vs-probes-v1

on:
  push:
    branches:
      - insacermo-realdata-amr-capability-vs-probes-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.1"
      - name: Run frozen NCBI AMR audit
        run: |
          python realdata_amr_capability_v1/audit.py | tee realdata_amr_capability_v1/output.txt
      - name: Require structural audit completion
        run: |
          OUT=realdata_amr_capability_v1/output.txt
          grep -q "scenario_count 280" "$OUT"
          grep -q "^AUDIT_PASS$" "$OUT"
