name: INSACERMO preservation versus action throughput audit
on:
  push:
    branches: [insacermo-action-preservation-optimality-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build frozen C3 kernel
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Compare three real-data policies and six genuine C3 Lean contracts
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/optimal_future_bikes_20261019/experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: insacermo-future-action-throughput-original-c3
          path: audit/optimal_future_bikes_20261019/evidence/
