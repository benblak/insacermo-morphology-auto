name: INSACERMO Erdős736 full filtered SAT branch proof
on:
  push:
    branches: ['lab/erdos302-737-one-proof-20261120']
    paths:
      - 'labs/erdos302_736_full_lean/generate_filtered_branch_lean.py'
      - '.github/workflows/lab-erdos736-filtered-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filtered:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ERDOS_GUIDED_OUT: /tmp/erdos736-guided
    steps:
      - uses: actions/checkout@v4
      - name: Install SciPy for nontrusted constraint selection
        run: |
          python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Generate checkable Lean full proof from branch guide and dual-selected source clauses
        run: |
          python3 labs/erdos302_736_full_lean/generate_filtered_branch_lean.py
          wc -c "$ERDOS_GUIDED_OUT/Erdos736Filtered.lean"
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile all full-736 theorems with Lean checked SAT
        run: |
          lean --version
          (cd "$ERDOS_GUIDED_OUT" && lean Erdos736Filtered.lean)
      - name: Refuse placeholders
        run: |
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          s=(Path(os.environ['ERDOS_GUIDED_OUT'])/'Erdos736Filtered.lean').read_text()
          s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          s=re.sub(r'--[^\n]*','',s)
          assert not re.search(r'\b(sorry|admit|axiom)\b',s)
          print('HOLE_FREE_PROOFS')
          PY
      - name: Archive exact generated Lean file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_ERDOS736_FULL_FILTERED_SAT_SOURCE
          path: /tmp/erdos736-guided/
          retention-days: 60
          if-no-files-found: ignore
