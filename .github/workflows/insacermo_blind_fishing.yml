name: INSACERMO Blind Fishing Real Data

on:
  pull_request:
    paths:
      - 'experiments/blind_fishing_insacermo_v1.py'
      - '.github/workflows/insacermo_blind_fishing.yml'

jobs:
  blind-fishing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed blind protocol
        run: python3 experiments/blind_fishing_insacermo_v1.py
