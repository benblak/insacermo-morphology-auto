name: INSACERMO LAB MATTER ANTIMATTER C3 LEAN 20261119
on:
  push:
    branches: [lab/antimatter-c3-lean-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen historical C3 source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('insacermo_one_engine.py').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(p)).encode()+b'\0'+p).hexdigest() == 'bd5310b3692bcbad4e874005b7dd8eda90616f74'
          print('HISTORICAL_C3_UNCHANGED')
          PY
          python3 -m py_compile labs/antimatter_20261119/audit_antimatter_c3.py insacermo_one_engine.py
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original C3 portable kernel and independent Lean no-go
        env:
          LEAN_PATH: ".:lean"
        run: |
          set -euo pipefail
          lean --version
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
          lean -o labs/refus_espoir_20261119/RefusEspoirBridge.olean labs/refus_espoir_20261119/RefusEspoirBridge.lean
          lean labs/antimatter_20261119/AntimatterObservation.lean
      - name: Scan formal text for unsupported placeholders
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for f in ('labs/refus_espoir_20261119/RefusEspoirBridge.lean','labs/antimatter_20261119/AntimatterObservation.lean'):
              s=Path(f).read_text()
              s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
              s=re.sub(r'--[^\n]*','',s)
              assert not re.findall(r'\b(sorry|admit|axiom)\b',s),f
          print('NO_UNPROVEN_PLACEHOLDERS')
          PY
      - name: Compare independent optimality and original C3 then verify Lean certificates
        env:
          LEAN_PATH: ".:lean"
          PYTHONPATH: "."
          ANTIMATTER_OUT: /tmp/insacermo-antimatter
        run: |
          python3 labs/antimatter_20261119/audit_antimatter_c3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSACERMO_ANTIMATTER_C3_LEAN_SYNTHETIC_CERTIFICATES
          path: /tmp/insacermo-antimatter/
          if-no-files-found: ignore
          retention-days: 30
