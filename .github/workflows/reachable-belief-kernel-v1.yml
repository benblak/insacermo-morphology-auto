name: reachable-belief-kernel-v1

on:
  push:
    branches:
      - insacermo-reachable-belief-kernel-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install leanprover/lean4:v4.33.1
          $HOME/.elan/bin/elan default leanprover/lean4:v4.33.1
      - name: Reject sorry admit custom axiom
        run: |
          FILE=reachable_belief_kernel/ReachableBeliefKernelV1.lean
          ! grep -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' "$FILE"
          ! grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "$FILE"
      - name: Lean kernel check
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lean reachable_belief_kernel/ReachableBeliefKernelV1.lean 2>&1 | tee reachable_belief_kernel/lean_output.txt
      - name: Require theorems and no sorryAx
        run: |
          OUT=reachable_belief_kernel/lean_output.txt
          for T in applyConstraint_comm applyConstraint_idem history_adjacent_swap history_duplicate_adjacent conflicting_same_probe_empty partialCodes_length canonical_history_code_count
          do
            grep -q "$T" "$OUT"
          done
          ! grep -q "sorryAx" "$OUT"
