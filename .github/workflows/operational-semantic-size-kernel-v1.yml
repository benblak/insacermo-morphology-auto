name: operational-semantic-size-kernel-v1

on:
  push:
    branches:
      - insacermo-operational-semantic-size-kernel-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install leanprover/lean4:v4.33.1
          $HOME/.elan/bin/elan default leanprover/lean4:v4.33.1
      - name: Reject sorry admit custom axiom
        run: |
          for FILE in             effective_size_quotient_kernel/EffectiveStateBoundV1.lean             semantic_complexity_kernel/SemanticComplexityLawKernelV1.lean             reachable_belief_kernel/ReachableBeliefKernelV1.lean             finite_reachable_belief_bound/FiniteReachableBeliefBoundV1.lean             operational_semantic_size_kernel/OperationalSemanticSizeKernelV1.lean
          do
            ! grep -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' "$FILE"
            ! grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "$FILE"
          done
      - name: Lean kernel check
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lean -o effective_size_quotient_kernel/EffectiveStateBoundV1.olean effective_size_quotient_kernel/EffectiveStateBoundV1.lean
          LEAN_PATH=effective_size_quotient_kernel             $HOME/.elan/bin/lean -o semantic_complexity_kernel/SemanticComplexityLawKernelV1.olean semantic_complexity_kernel/SemanticComplexityLawKernelV1.lean
          $HOME/.elan/bin/lean -o reachable_belief_kernel/ReachableBeliefKernelV1.olean reachable_belief_kernel/ReachableBeliefKernelV1.lean
          LEAN_PATH=reachable_belief_kernel             $HOME/.elan/bin/lean -o finite_reachable_belief_bound/FiniteReachableBeliefBoundV1.olean finite_reachable_belief_bound/FiniteReachableBeliefBoundV1.lean
          LEAN_PATH=effective_size_quotient_kernel:semantic_complexity_kernel:reachable_belief_kernel:finite_reachable_belief_bound             $HOME/.elan/bin/lean operational_semantic_size_kernel/OperationalSemanticSizeKernelV1.lean 2>&1 | tee operational_semantic_size_kernel/lean_output.txt
      - name: Require final theorems and no sorryAx
        run: |
          OUT=operational_semantic_size_kernel/lean_output.txt
          for T in             le_minNat             operational_semantic_size_law             planTrace_occurrences_le             distinct_visits_le_prospective             semantic_catalogue_slot_count             reachable_catalogue_slot_count             reachable_history_lands_in_operational_catalogue             certificate_respects_operational_ceiling             operational_semantic_size_from_plan             ternary_depth8_prospective_bound
          do
            grep -q "$T" "$OUT"
          done
          ! grep -q "sorryAx" "$OUT"
