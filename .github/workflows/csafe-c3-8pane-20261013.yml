name: INSACERMO frozen C3 8 real CSAFE glass panes
on:
  push:
    branches: [insacermo-c3-csafe-8pane-proof-2026-10-13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile frozen C3 verification modules
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Rebuild authentic 48 pane data and verify 4 original C3 verdicts
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/csafe_c3_8pane_20261013/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: csafe-8pane-genuine-c3-lean-receipts
          path: audit/csafe_c3_8pane_20261013/evidence/
