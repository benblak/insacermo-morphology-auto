name: INSACERMO C3 PYTHON LEAN REFINEMENT AUDIT
on:
  push:
    branches: [insacermo-c3-python-lean-refinement-2026-10-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile frozen finite C3 verification kernel and new bridge
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
          lean audit/python_lean_refinement_20261012/C3PolicyAttestation.lean
      - name: Real Lean binary required; verify all proof sources
        run: |
          lean --version
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' audit/python_lean_refinement_20261012/C3PolicyAttestation.lean
