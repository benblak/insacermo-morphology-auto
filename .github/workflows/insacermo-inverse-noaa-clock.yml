name: INSACERMO inverse — extract an unknown NOAA acquisition clock
on:
  push:
    branches:
      - lab/c3-inverse-observation-hidden-clock-20261117
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Freeze original INSACERMO kernel and validate Python syntax
        run: |
          git hash-object insacermo_one_engine.py | grep -Fx bd5310b3692bcbad4e874005b7dd8eda90616f74
          python -m py_compile labs/inverse_noaa_clock.py
      - name: Discover cadence without supplied period, then falsify on four other primary sources
        shell: bash
        run: |
          mkdir -p /tmp/insacermo_inverse_clock
          set +e
          python labs/inverse_noaa_clock.py /tmp/insacermo_inverse_clock > /tmp/insacermo_inverse_clock/run.log 2>&1
          rc=$?
          echo "program_exit=$rc" > /tmp/insacermo_inverse_clock/status.txt
          sha256sum labs/inverse_noaa_clock.py | sed 's/^/source_sha256=/' >> /tmp/insacermo_inverse_clock/status.txt
          cat /tmp/insacermo_inverse_clock/run.log
          exit 0
      - name: Independent raw NOAA audit of all 15 source-channel measurements
        shell: bash
        run: |
          set +e
          python labs/inverse_noaa_clock_independent_audit.py /tmp/insacermo_inverse_clock > /tmp/insacermo_inverse_clock/independent.log 2>&1
          rc=$?
          echo "independent_exit=$rc" >> /tmp/insacermo_inverse_clock/status.txt
          cat /tmp/insacermo_inverse_clock/independent.log
          if [ "$rc" -eq 0 ]; then
            echo "independent_result=PASS" >> /tmp/insacermo_inverse_clock/status.txt
          else
            echo "independent_result=FAIL" >> /tmp/insacermo_inverse_clock/status.txt
          fi
          exit 0
      - name: Install Lean 4.33.1
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile formal finite clock and epistemic-limit theorems
        shell: bash
        run: |
          set +e
          lean labs/InverseNoaaClock.lean > /tmp/insacermo_inverse_clock/lean.log 2>&1
          rc=$?
          echo "lean_exit=$rc" >> /tmp/insacermo_inverse_clock/status.txt
          sha256sum labs/InverseNoaaClock.lean | cut -d' ' -f1 | sed 's/^/lean_source_sha256=/' >> /tmp/insacermo_inverse_clock/status.txt
          if [ "$rc" -eq 0 ]; then
            echo "lean_result=PASS" >> /tmp/insacermo_inverse_clock/status.txt
          else
            echo "lean_result=FAIL" >> /tmp/insacermo_inverse_clock/status.txt
          fi
          cat /tmp/insacermo_inverse_clock/lean.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSACERMO_REAL_NOAA_INVERSE_CLOCK_RAW_AND_AUDIT
          path: /tmp/insacermo_inverse_clock
          retention-days: 90
      - name: Publish original sealed model and audit, including negative outcomes
        if: always()
        run: |
          mkdir -p labs/inverse_clock_results_20261117
          for name in audit.json sealed_before_validation.json run.log status.txt independent.log independent_receipt.json lean.log; do
            if [ -f "/tmp/insacermo_inverse_clock/$name" ]; then
              cp "/tmp/insacermo_inverse_clock/$name" labs/inverse_clock_results_20261117/
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/inverse_clock_results_20261117
          git commit -m "lab: archive inverse observation verdict and original sealed model [skip ci]" || exit 0
          git push origin HEAD:lab/c3-inverse-observation-hidden-clock-20261117
