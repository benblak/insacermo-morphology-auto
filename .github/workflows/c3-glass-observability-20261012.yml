name: C3 glass observability exact science pilot
on:
  push:
    branches: [insacermo-c3-uci-glass-zeroerror-2026-10-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged C3 formal modules
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Audit all 214 UCI samples, 930 probes, and verify C3 sample pair with Lean
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/uci_glass_c3_20261012/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: glass-exact-observability-c3-lean
          path: audit/uci_glass_c3_20261012/evidence/
