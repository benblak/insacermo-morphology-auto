name: INSACERMO Multi Repair Rank Growth V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/multi_repair_rank_growth_v1.py
      - .github/workflows/multi-repair-rank-growth-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/multi_repair_rank_growth_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_MULTI_REPAIR_RANK_GROWTH_V1
          path: MULTI_REPAIR_RANK_GROWTH_V1.json
          if-no-files-found: error
