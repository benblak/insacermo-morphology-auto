name: INSACERMO Mushroom Information Price V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/mushroom_information_price_v1.py
      - .github/workflows/mushroom-information-price-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python experiments/mushroom_information_price_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_MUSHROOM_INFORMATION_PRICE_V1
          path: MUSHROOM_INFORMATION_PRICE_V1.json
          if-no-files-found: error
