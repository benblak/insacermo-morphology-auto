name: INSACERMO Real ModeChoice Stress Contract V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/real_modechoice_stress_contract_v1.py
      - .github/workflows/real-modechoice-stress-contract-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet statsmodels pandas
      - run: python experiments/real_modechoice_stress_contract_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_REAL_MODECHOICE_STRESS_CONTRACT_V1
          path: REAL_MODECHOICE_STRESS_CONTRACT_V1.json
          if-no-files-found: error
