name: INSACERMO Obstruction Reconstruction Duality V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/obstruction_reconstruction_duality_v1.py
      - .github/workflows/obstruction-reconstruction-duality-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/obstruction_reconstruction_duality_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_OBSTRUCTION_RECONSTRUCTION_DUALITY_V1
          path: OBSTRUCTION_RECONSTRUCTION_DUALITY_V1.json
          if-no-files-found: error
