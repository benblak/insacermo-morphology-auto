name: INSACERMO Root Duality and No-Go Lean
on:
  push:
    branches: [insacermo-root-duality-no-go-v1-20261011]
  pull_request:
    branches: [insacermo-total-raw-to-lean-real-stigler-v1-20261011]
permissions:
  contents: read
jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check root duality/no-go/dynamic counterexample
        run: |
          lean --version
          lean lean/RootPossibilityDualityV1.lean
      - name: Static trust audit
        run: |
          ! grep -En '(^|[^A-Za-z_])(sorry|admit|axiom)([^A-Za-z_]|$)' lean/RootPossibilityDualityV1.lean
