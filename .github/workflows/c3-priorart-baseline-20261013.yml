name: C3 vs classical AND OR contingent planner
on:
  push:
    branches: [insacermo-c3-literature-fair-baseline-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original frozen C3 formal kernel
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Independent standard AND OR planning vs original C3 and Lean receipts
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/c3_priorart_baseline_20261013/compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: c3-vs-classical-contingent-planner-audit
          path: audit/c3_priorart_baseline_20261013/evidence/
