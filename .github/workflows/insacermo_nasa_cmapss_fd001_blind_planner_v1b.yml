name: INSACERMO NASA C-MAPSS FD001 Blind Planner V1B

on:
  pull_request:
    branches:
      - insacermo-bellman-20260911
    paths:
      - 'experiments/INSACERMO_NASA_CMAPSS_FD001_BLIND_PLANNER_PREREG_V1.json'
      - 'experiments/INSACERMO_NASA_CMAPSS_FD001_RETRIEVAL_COMPATIBILITY_NOTE_V1.json'
      - 'experiments/run_nasa_cmapss_fd001_blind_planner_v1b.py'
      - '.github/workflows/insacermo_nasa_cmapss_fd001_blind_planner_v1b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-frozen-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Verify original frozen preregistration and compatibility note
        run: |
          python - <<'PY'
          import json
          p='experiments/INSACERMO_NASA_CMAPSS_FD001_BLIND_PLANNER_PREREG_V1.json'
          n='experiments/INSACERMO_NASA_CMAPSS_FD001_RETRIEVAL_COMPATIBILITY_NOTE_V1.json'
          d=json.load(open(p))
          m=json.load(open(n))
          assert d['status']=='FROZEN_BEFORE_FD001_TEST_RUL_OPENED'
          assert m['original_preregistration_commit']=='b3fc455c8b219326bf665cd140bcbdd343b96a04'
          assert m['methodological_status']=='PRESERVES_ORIGINAL_FROZEN_PROTOCOL'
          assert m['scientific_changes']=='NONE'
          print('Original frozen preregistration preserved:', d['name'])
          print('Compatibility note:', m['name'])
          PY

      - name: Execute frozen NASA C-MAPSS planner with retrieval-only fix
        run: python experiments/run_nasa_cmapss_fd001_blind_planner_v1b.py

      - name: Show regime verdict
        run: cat experiments/nasa_cmapss_fd001_blind_planner_v1b_output/REPORT.md

      - name: Upload complete audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_NASA_CMAPSS_FD001_BLIND_PLANNER_V1B
          path: experiments/nasa_cmapss_fd001_blind_planner_v1b_output/
          if-no-files-found: error
