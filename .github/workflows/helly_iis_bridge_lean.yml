name: INSACERMO Helly IIS Bridge Lean

on:
  pull_request:
    paths:
      - 'formal/actionability_information/InsacermoActionabilityInformation/HellyIISBridge.lean'
      - 'formal/actionability_information/InsacermoActionabilityInformation.lean'
      - '.github/workflows/helly_iis_bridge_lean.yml'

jobs:
  helly-iis-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal/actionability_information
          lake update

      - name: Reject placeholders
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit)\b' formal/actionability_information/InsacermoActionabilityInformation/HellyIISBridge.lean; then
            echo 'Proof placeholder found.'
            exit 1
          fi

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/actionability_information
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: true
          leanchecker-args: 'InsacermoActionabilityInformation.HellyIISBridge'

      - name: Check Helly IIS bridge
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal/actionability_information
          lake env lean InsacermoActionabilityInformation/HellyIISBridge.lean
