name: C3 canonical JSON formatting acceptance and semantic rejection
on:
  push:
    branches: [insacermo-c3-canonicalization-acceptance-2026-10-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original C3 modules
        env:
          LEAN_PATH: ".:lean"
        run: |
          lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Rebuild pinned authentic benchmark data and five Lean receipts
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/inrc2_e2e_20261012/audit.py
      - name: Run strict verifier regression
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/inrc2_e2e_20261012/test_bound_verifier.py
      - name: Run canonicalization acceptance versus semantic rejection
        env:
          LEAN_PATH: ".:lean"
        run: python3 audit/inrc2_e2e_20261012/test_canonicalization_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: c3-canonical-json-acceptance-proof
          path: audit/inrc2_e2e_20261012/evidence/canon_tests/CANONICALIZATION_AUDIT.json
