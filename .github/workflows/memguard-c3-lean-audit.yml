name: INSACERMO MemGuard C3 Lean audit
on:
  push:
    branches:
      - insacermo-sensing-intervention-audit-20261022
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone Lean 4.33.1 (no Lake manifest)
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original portable C3 foundations
        run: |
          lean --version
          LEAN_PATH=. lean -o C3/PortableFiniteVerifierV1.olean C3/PortableFiniteVerifierV1.lean
          LEAN_PATH=. lean -o C3/PortableVerifierSoundnessV1.olean C3/PortableVerifierSoundnessV1.lean
          LEAN_PATH=. lean -o C3/PortableExactSearchV1.olean C3/PortableExactSearchV1.lean
      - name: Verify sensorless boundary counterexample
        run: |
          LEAN_PATH=. lean audit_self_20261022/NoProbeCounterexample.lean
      - name: Verify sensing vs intervention counterexamples
        run: |
          LEAN_PATH=. lean audit_self_20261022/SensingVsIntervention.lean
      - name: Verify distinct new certificate structures
        run: |
          for name in EXIT_200 EXIT_222 NO_ENTRY_200; do
            LEAN_PATH=. lean "audit_memguard_20261022/$name.lean"
          done
      - name: Compile full certificate structures
        run: |
          for name in EXIT_200 EXIT_222 NO_ENTRY_200; do
            LEAN_PATH=. lean "audit_memguard_20261022/full_$name.lean"
          done
      - name: Verify all 80 declared instances with Lean kernel
        run: |
          LEAN_PATH=. lean audit_memguard_20261022/All80DeclaredInstances.lean
      - name: Reject admission placeholders
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' audit_memguard_20261022/*.lean; then exit 1; fi
      - name: Publish verifiable result to commit status API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$AUDIT_JOB_STATUS" = "success" ]; then
            AUDIT_STATE=success
          else
            AUDIT_STATE=failure
          fi
          export AUDIT_STATE
          python3 - <<'PY'
          import json, os, urllib.request
          state = os.environ["AUDIT_STATE"]
          body = {
              "state": state,
              "context": "insacermo/memguard-c3-lean",
              "description": "Lean 4.33.1 certificate audit: " + state,
              "target_url": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/statuses/" + os.environ["GITHUB_SHA"]
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"},
              method="POST")
          with urllib.request.urlopen(req, timeout=30) as response:
              print("Published commit status", response.status, body["context"], state)
          PY
