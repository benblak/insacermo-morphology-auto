name: INSACERMO Actionability Information Lean

on:
  pull_request:
    paths:
      - 'formal/actionability_information/**'
      - '.github/workflows/insacermo_actionability_information_lean.yml'

jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/actionability_information
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: true
