name: INSACERMO Exact Theory Identification 5W V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/exact_theory_identification_5w_v1.py
      - .github/workflows/exact-theory-identification-5w-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/exact_theory_identification_5w_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_EXACT_THEORY_IDENTIFICATION_5W_V1
          path: EXACT_THEORY_IDENTIFICATION_5W_V1.json
          if-no-files-found: error
