name: Glass retrospective heldout audit without label leakage
on:
  push:
    branches: [insacermo-glass-heldout-validation-2026-10-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heldout threshold selection and abstaining decision test
        run: python3 audit/glass_holdout_20261012/holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: glass-heldout-20-seeds-report
          path: audit/glass_holdout_20261012/evidence/
