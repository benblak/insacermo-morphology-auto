name: INSACERMO Higher Order Actionability Lean
on:
  push:
    branches: [insacermo-high-order-obstruction-theorem-2026-10-09]
    paths:
      - lean/HigherOrderActionabilityObstructionV1.lean
      - .github/workflows/higher-order-actionability-lean.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel compile all-order theorem
        run: lean lean/HigherOrderActionabilityObstructionV1.lean
      - name: No shortcuts
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)[[:space:]]' lean/HigherOrderActionabilityObstructionV1.lean; then exit 1; fi
          echo NO_SORRY_ADMIT_AX
