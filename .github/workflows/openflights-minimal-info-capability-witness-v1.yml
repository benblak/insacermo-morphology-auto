name: INSACERMO OpenFlights Minimal Info Capability Witness V1
on:
  push:
    branches: [insacermo-fmnist-min-info-v1-2026-10-05]
    paths:
      - experiments/openflights_minimal_info_capability_witness_v1.py
      - .github/workflows/openflights-minimal-info-capability-witness-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python experiments/openflights_minimal_info_capability_witness_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_OPENFLIGHTS_MINIMAL_INFO_CAPABILITY_WITNESS_V1
          path: OPENFLIGHTS_MINIMAL_INFO_CAPABILITY_WITNESS_V1.json
          if-no-files-found: error
