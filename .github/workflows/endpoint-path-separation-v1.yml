name: INSACERMO Endpoint Path Separation V1
on:
  push:
    branches:
      - insacermo-fmnist-min-info-v1-2026-10-05
    paths:
      - experiments/endpoint_path_separation_v1.py
      - .github/workflows/endpoint-path-separation-v1.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/endpoint_path_separation_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_ENDPOINT_PATH_SEPARATION_V1
          path: ENDPOINT_PATH_SEPARATION_V1.json
          if-no-files-found: error
